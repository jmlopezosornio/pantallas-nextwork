<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Maqueta — NextWork opción B</title>
<style>
:root{--ink:#12223d;--muted:#6b7e99;--bg:#f2f5fb;--edge:#e0e7f1;--navy:#101b39;--blue:#3657a3;--purple:#453087;--lime:#ced631;--shadow:0 10px 32px #16294e0c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}a{text-decoration:none}
.demo-bar{position:sticky;top:0;z-index:100;background:#fefefe;box-shadow:0 2px 14px #10244316;padding:10px clamp(14px,2.8vw,40px);display:flex;gap:13px;align-items:center;flex-wrap:wrap;min-height:60px}
.demo-mark{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:900;letter-spacing:.06em;color:#1f3760}
.demo-mark span{background:#ecf0fb;color:#475785;padding:5px 7px;border-radius:7px}
.demo-title{font-size:12px;color:#536886;font-weight:700;flex:1}
.demo-links{display:flex;gap:6px;align-items:center}
.demo-link{font-size:12px;font-weight:800;padding:9px 14px;color:#344e74;border:1px solid #dde5f0;border-radius:10px;background:#fff}
.demo-link.active{color:#fff;background:#263866;border-color:#263866}
.demo-warning{background:#fff7e7;color:#905e11;font-size:10px;border-radius:999px;padding:7px 10px;font-weight:900;white-space:nowrap}
.shell{min-height:calc(100vh - 60px);display:flex}
.sidebar{width:255px;background:linear-gradient(180deg,#101b39,#182748);color:#b6c6dc;padding:22px 15px;display:flex;flex-direction:column;flex-shrink:0;min-height:calc(100vh - 60px)}
.sidebar.brand-arcuva{background:linear-gradient(180deg,#132e4d,#102038)}
.brand-card{padding:20px 13px;min-height:121px;background:#fff;border-radius:19px;margin-bottom:27px;display:flex;align-items:center;justify-content:center}
.brand-card img{display:block;max-width:197px;max-height:78px;object-fit:contain}
.supra{font-size:10px;letter-spacing:.14em;color:#8499b5;text-transform:uppercase;font-weight:900;margin:10px 10px}
.nav{color:#becbe0;width:100%;text-align:left;border:0;border-radius:11px;background:transparent;padding:13px 14px;font-size:13px;font-weight:750;display:flex;align-items:center;gap:10px;margin:3px 0}
.nav.active{background:rgba(255,255,255,.11);color:#fff;box-shadow:inset 3px 0 #8f78e6}
.brand-arcuva .nav.active{box-shadow:inset 3px 0 #ced631}
.nav:hover{background:rgba(255,255,255,.07)}
.nav-icon{font-size:16px;display:inline-block;width:19px;text-align:center}
.side-spacer{flex:1}
.sidebar-footer{border-top:1px solid #ffffff20;margin:18px 9px 0;padding-top:17px;font-size:11px;line-height:1.7;color:#8ea2bd}
.main{min-width:0;flex:1}
.top{min-height:81px;background:#fff;border-bottom:1px solid var(--edge);display:flex;align-items:center;justify-content:space-between;padding:15px clamp(20px,3vw,46px);gap:18px}
.top-title{font-size:17px;font-weight:900;letter-spacing:-.02em}.top-sub{font-size:12px;color:#7890aa;margin-top:5px}
.top-right{display:flex;gap:12px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;background:#e7edfd;color:#3656a2;display:grid;place-items:center;font-weight:900;font-size:12px}
.top-name{font-size:11px;color:#56708e;font-weight:800}
.workspace{padding:31px clamp(16px,3vw,44px);max-width:1320px;margin:auto}
.section-kicker{color:#7988a2;letter-spacing:.14em;font-size:11px;font-weight:900}
.headline{font-size:29px;letter-spacing:-.035em;line-height:1.18;margin:7px 0}
.lead{font-size:13px;color:#71849d;line-height:1.7;margin:0 0 25px}
.grid-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:18px 0}
.metric,.surface{background:#fff;border:1px solid var(--edge);border-radius:18px;box-shadow:var(--shadow)}
.metric{padding:20px 22px}.metric-icon{font-size:19px}.metric-label{font-size:12px;color:#7b8da5;font-weight:750;margin-top:13px}
.metric-value{font-size:30px;font-weight:900;letter-spacing:-.04em;color:#15294e;margin-top:7px}
.surface{padding:23px;margin:20px 0}.surface h3{font-size:17px;margin:0 0 14px}
.col-2{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:stretch}
.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:530px}
th{padding:13px;text-align:left;background:#f5f7fc;text-transform:uppercase;letter-spacing:.06em;font-size:10px;color:#7b8ca5}
td{font-size:12px;padding:13px;border-bottom:1px solid #ecf0f7}td strong{font-weight:800}.tiny{font-size:10px;color:#8c9ab0;margin-top:5px}
.pill{border-radius:999px;padding:6px 10px;font-size:10px;font-weight:900;display:inline-block;background:#edf1fb;color:#4c5b91}
.pill.good{background:#e9f7ee;color:#367952}.pill.warn{background:#fff5e3;color:#97691c}
.brand-display{display:flex;align-items:center;gap:16px;padding:17px 18px;background:#f9fbff;border:1px solid #e5ebf7;border-radius:14px}
.brand-display img{width:175px;max-height:56px;object-fit:contain}
.muted{font-size:12px;color:#74849b;line-height:1.65}
.row{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.btn{border:1px solid #cbd5e8;background:#fff;border-radius:10px;padding:11px 14px;font-size:12px;font-weight:850;color:#31517b}
.btn.primary{background:#344f98;color:white;border-color:#344f98}.btn.green{background:#18365c;color:white;border-color:#18365c}
.btn:hover{filter:brightness(.98)}
.note{background:#f7f9fd;border:1px dashed #cbd8ea;border-radius:13px;padding:15px;font-size:12px;color:#6f8099;line-height:1.7}
.callout{background:#f4f0ff;border:1px solid #ded3ff;border-radius:15px;padding:17px;color:#543e8a;font-size:12px;line-height:1.65}
.duo-row{display:flex;gap:10px;flex-wrap:wrap}.hero-actions{margin-top:18px}
.mock-report{border:1px solid #dae3ef;background:white;max-width:910px;margin:10px auto 0;border-radius:4px;padding:34px 38px;box-shadow:0 8px 28px #1726420d}
.report-top{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #dbe5f0;padding-bottom:20px;gap:25px}
.report-top img{max-width:190px;max-height:68px;object-fit:contain}.report-title{text-align:right}.report-title h3{margin:0 0 4px;font-size:21px}.report-title p{margin:0;font-size:11px;color:#718198}
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:19px 0}.report-num{text-align:center;border:1px solid #eef0f6;padding:14px;background:#f7f9fd}.report-num b{display:block;font-size:20px;color:#1d3c69}
.print-note{font-size:11px;color:#8da1bc;margin-top:12px;text-align:right}
.demo-login{max-width:1030px;margin:12px auto;background:#fff;display:grid;grid-template-columns:1fr 1fr;min-height:530px;border:1px solid #e0e8f2;box-shadow:0 13px 50px #12264c1a;border-radius:22px;overflow:hidden}
.demo-login-visual{padding:37px;background:linear-gradient(150deg,#111d40,#253b65);color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.demo-login-visual h2{font-size:36px;letter-spacing:-.045em;line-height:1.1}.demo-login-visual p{font-size:13px;color:#d7e2f1;line-height:1.7}
.demo-login-form{padding:45px 43px;display:flex;flex-direction:column;justify-content:center}
.demo-login-form img{max-width:208px;max-height:73px;object-fit:contain;margin-bottom:23px}
.demo-login-form h3{font-size:24px;letter-spacing:-.03em;margin:0 0 8px}
.demo-login-form label{font-size:11px;color:#566882;font-weight:850;display:block;margin:16px 0 7px}
.demo-login-form input{width:100%;height:44px;border:1px solid #d6dfec;border-radius:9px;background:#fff;padding:0 13px}
.demo-login-form .btn{margin-top:21px}
.mock-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mock-form label{display:block;font-size:11px;font-weight:850;color:#506684;margin-bottom:6px}
.mock-form input,.mock-form select{width:100%;height:43px;border:1px solid #d5deeb;background:#fff;border-radius:10px;padding:0 10px}
.mock-form .full{grid-column:1/-1}.hint{font-size:12px;color:#5e7593;line-height:1.6}
.option-head{padding:13px 15px;background:#eef3ff;border-radius:14px;border:1px solid #dce5fa;color:#38548d;font-size:12px;font-weight:800;line-height:1.6;margin:0 0 18px}
.option-head.b{background:#eaf6f4;border-color:#cde9e4;color:#286f65}
.mini-action{color:#376296;font-weight:850;font-size:12px}
@media(max-width:940px){.sidebar{width:205px}.col-2{grid-template-columns:1fr}.demo-title{display:none}.metric{padding:18px}.brand-display img{width:130px}}
@media(max-width:680px){.demo-bar{align-items:center}.demo-warning{display:none}.shell{display:block}.sidebar{min-height:auto;width:100%;flex-direction:row;padding:10px;gap:6px;overflow-x:auto}.sidebar .brand-card,.sidebar .supra,.sidebar-footer,.side-spacer{display:none}.nav{width:auto;white-space:nowrap;flex-shrink:0;margin:0}.top{min-height:64px;padding:13px}.top-name{display:none}.workspace{padding:18px 14px}.grid-metrics,.report-grid{grid-template-columns:1fr}.demo-login{grid-template-columns:1fr}.demo-login-visual{min-height:250px}.demo-login-form{padding:29px}.mock-report{padding:17px}.report-top img{max-width:100px}.report-title h3{font-size:15px}.report-title p{font-size:9px}.mock-form{grid-template-columns:1fr}}
</style>

  function el(id){return document.getElementById(id);}
  function navButton(key,icon,label){return '<button type="button" class="nav '+(key===state?'active':'')+'" data-nav="'+key+'"><span class="nav-icon">'+icon+'</span>'+label+'</button>';}
  function renderNav(){
    var arcuva=state.indexOf('arcuva-')===0;
    el('sidebar').classList.toggle('brand-arcuva',arcuva);
    el('brandLogo').src=arcuva?logoArcuva:logoNext;
    el('brandLogo').onerror=function(){this.style.display='none';this.parentNode.setAttribute('data-label',arcuva?'ARCUVA':'NEXTWORK');this.parentNode.style.color='#162e56';this.parentNode.style.fontWeight='900';this.parentNode.textContent=arcuva?'ARCUVA':'NEXTWORK';};
    el('navHeading').textContent=arcuva?'ESPACIO ARCUVA':'ADMINISTRACIÓN CENTRAL';
    el('sideFooter').innerHTML=arcuva?'Arcuva · Powered by NextWork<br>Ejemplo visual sin datos reales':'NextWork · Gestión de pantallas LED<br>Maqueta sin conexión al sistema';
    var html='';
    if(arcuva){
      html+=navButton('arcuva-dashboard','◫','Resumen');
      html+=navButton('arcuva-campanias','▣','Campañas');
      html+=navButton('arcuva-clientes','♙','Clientes');
      html+=navButton('arcuva-reportes','▤','Reportes');
      html+='<div class="supra" style="margin-top:19px">PLATAFORMA</div>'+navButton('dashboard','⌂','Volver a NextWork');
    }else{
      html+=navButton('dashboard','◫','Dashboard');
      html+=navButton('screens','▣','Pantallas');
      html+=navButton('reports','▤','Reportes');
      html+=navButton('login','⇥','Vista de ingreso');
      if(option==='B'){
        html+='<div class="supra" style="margin-top:20px">ACCESO A EMPRESAS</div>';
        html+=navButton('arcuva-dashboard','▰','Portal Arcuva');
        html+=navButton('arcuva-campanias','▥','Campañas Arcuva');
      }
    }

  }
  function go(next){
    state=next;
    var arcuva=state.indexOf('arcuva-')===0;
    el('topUser').textContent=arcuva?'Administración Arcuva':'Superadmin';
    el('avatar').textContent=arcuva?'AR':'NW';
    el('topSub').textContent=arcuva?'Portal independiente · Arcuva':'Administración central · NextWork';
    renderNav();
    var page=el('content');
    if(state==='dashboard')page.innerHTML=dashboard();
    else if(state==='screens')page.innerHTML=screens();
    else if(state==='reports')page.innerHTML=report(false);
    else if(state==='login')page.innerHTML=login();
    else if(state==='arcuva-dashboard')page.innerHTML=arcuvaHome();
    else if(state==='arcuva-campanias')page.innerHTML=arcuvaCampaigns();
    else if(state==='arcuva-clientes')page.innerHTML=arcuvaClients();
    else if(state==='arcuva-reportes')page.innerHTML=report(true);
    else page.innerHTML=dashboard();
    var names={dashboard:'Dashboard',screens:'Pantallas',reports:'Reportes',login:'Pantalla de ingreso','arcuva-dashboard':'Arcuva · Resumen','arcuva-campanias':'Arcuva · Campañas','arcuva-clientes':'Arcuva · Clientes','arcuva-reportes':'Arcuva · Reportes'};
    el('pageTitle').textContent=names[state]||'NextWork';
  }

      '<div class="mock-report"><div class="report-top"><img alt="Logo '+brand+'" src="'+log+'"><div class="report-title"><h3>Reporte de Clientes y Campañas</h3><p>Sistema de Gestión de Pantallas</p></div></div>'+
      '<div class="report-grid"><div class="report-num"><b>'+(arcuva?'1':'2')+'</b>Pantallas</div><div class="report-num"><b>'+(arcuva?'10':'22')+'</b>Campañas</div><div class="report-num"><b>'+(arcuva?'1':'2')+'</b>Empresas/clientes</div></div>'+
      '<table><thead><tr><th>Cliente</th><th>Campaña</th><th>Pantalla</th><th>Estado</th></tr></thead><tbody>'+
      '<tr><td>Arcuva</td><td>Video 1</td><td>SMA 01</td><td>Vigente</td></tr>'+
      (!arcuva?'<tr><td>NextWork</td><td>Información institucional</td><td>Recursos Hídricos</td><td>Vigente</td></tr>':'')+
      '</tbody></table><p class="print-note">Diseño demostrativo · Sin datos reales de reproducción</p></div>';
  }
  function login(){
    return headline('IDENTIDAD DE MARCA','Acceso a NextWork','Se reemplaza el nombre escrito a mano por el logo original de NextWork.')+
      '<div class="demo-login"><div class="demo-login-visual"><div style="font-size:12px;font-weight:900;letter-spacing:.13em">NEXTWORK · PANTALLAS</div><div><h2>Todo el control.<br>Una plataforma.</h2><p>Gestioná pantallas, campañas y clientes desde un mismo lugar.</p></div><div style="font-size:12px;color:#a9bfd9">Plataforma de gestión de publicidad digital</div></div>'+
      '<div class="demo-login-form"><img alt="Logo NextWork" src="'+logoNext+'"><h3>Iniciar sesión</h3><p class="muted">Accedé al panel central de administración.</p><label>Correo electrónico</label><input disabled value="administracion@nextwork.com.ar"><label>Contraseña</label><input disabled type="password" value="example123">'+btn('Ingresar · demostración','demo','primary')+'<p class="tiny">Este formulario no conecta con usuarios reales.</p></div></div>';
  }
  function arcuvaHome(){
    return banner('OPCIÓN B · Portal Arcuva con funciones de administración simuladas','b')+
      headline('ESPACIO DE EMPRESA','Bienvenido a Arcuva','Panel separado con su logo, sus clientes y sus campañas, sin mostrar datos de otras empresas.')+
      metrics([['▣','Pantallas','1'],['▤','Campañas','10'],['♙','Clientes','1']])+
      '<div class="col-2"><div class="surface"><h3>Tu pantalla</h3><p><strong>Grupo Arcuva SMA Pant 01</strong><br><span class="muted">San Martín de los Andes · NovaStar Taurus</span></p><span class="pill good">Registrada a Arcuva</span></div>'+
      '<div class="surface"><h3>Administración simple</h3><p class="muted">Alta, edición y pausa de campañas; gestión de clientes; asociación directa con SMA 01.</p>'+btn('Administrar campañas','arcuva-campanias','green')+'</div></div>';
  }
  function arcuvaCampaigns(){
    var rows=sampleCampaigns.map(function(c){return '<tr><td><strong>'+c.name+'</strong><div class="tiny">'+c.kind+'</div></td><td>'+c.client+'</td><td>'+c.screen+'</td><td>'+c.share+'</td><td><span class="pill '+(c.status==='Vigente'?'good':'warn')+'">'+c.status+'</span></td><td><button class="btn" data-do="edit-campaign">Editar</button></td></tr>';}).join('');
    return banner('Esta vista se agregaría en la opción B. Los botones solo abren una demostración.','b')+
      '<div class="row">'+headline('CONTENIDOS','Campañas de Arcuva','Administración de publicaciones vinculadas a las pantallas de la empresa.')+btn('+ Nueva campaña','new-campaign','green')+'</div>'+
      '<div class="surface"><div class="table-wrap"><table><thead><tr><th>Campaña</th><th>Cliente</th><th>Pantalla</th><th>Participación</th><th>Estado</th><th>Acción</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<p class="muted">Los registros de esta maqueta son ejemplos visuales. El sistema real tiene sus propias reglas de programación y reproducción.</p></div>';
  }
  function arcuvaClients(){
    return banner('Opción B · Gestión de clientes específica de Arcuva','b')+
      '<div class="row">'+headline('DIRECTORIO','Clientes de Arcuva','Los clientes de cada empresa se administran dentro de su propio portal.')+btn('+ Nuevo cliente','new-client','green')+'</div>'+
      '<div class="surface"><div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Campañas</th><th>Empresa</th><th>Acción</th></tr></thead><tbody>'+
      '<tr><td><strong>Arcuva</strong><div class="tiny">Cliente de demostración</div></td><td>10</td><td>Arcuva</td><td><button class="btn" data-do="edit-client">Editar</button></td></tr></tbody></table></div></div>';
  }
  function action(name){
    if(name==='arcuva-dashboard'||name==='arcuva-campanias'||name==='arcuva-clientes')return go(name);
    if(name==='new-campaign'||name==='edit-campaign')return form('campania');
    if(name==='new-client'||name==='edit-client')return form('cliente');
    var host=el('content'); var old=host.querySelector('#demo-note');if(old)old.remove();
    host.insertAdjacentHTML('afterbegin','<div class="note" id="demo-note">Esta maqueta no inicia sesiones ni modifica datos. Es solamente una muestra del diseño.</div>');
  }
  function form(type){
    var isCampaign=type==='campania';
    var box='<div class="option-head b">Formulario de ejemplo · No se guardan campañas, clientes ni cambios reales.</div>';
    box+=headline('ARCUVA · PROPUESTA',' '+(isCampaign?'Nueva campaña':'Nuevo cliente'),'Una pantalla simple sin elegir grupos para cada operación.');
    if(isCampaign){
      box+='<div class="surface"><div class="mock-form"><div><label>Nombre de la campaña</label><input value="Nueva publicidad"></div><div><label>Cliente</label><select><option>Arcuva</option></select></div>'+
      '<div><label>Contenido</label><select><option>Video</option><option>Imagen</option><option>Página web</option></select></div>'+
      '<div><label>Pantalla de destino</label><select><option>SMA 01 · Arcuva</option></select></div>'+
      '<div><label>Fecha de inicio</label><input type="date"></div><div><label>Fecha de fin</label><input type="date"></div>'+
      '<div><label>Prioridad / participación</label><select><option>25%</option><option>50%</option><option>75%</option><option>100%</option></select></div>'+
      '</div><p class="hint">El reproductor mantendría las reglas de distribución de campañas vigentes. El diseño es ilustrativo.</p><div class="duo-row">'+btn('Volver','arcuva-campanias')+btn('Vista previa · No guardar','demo','green')+'</div></div>';
    }else{
      box+='<div class="surface"><div class="mock-form"><div><label>Nombre del cliente</label><input placeholder="Nombre comercial"></div><div><label>CUIT</label><input placeholder="CUIT"></div>'+
      '<div><label>Correo electrónico</label><input placeholder="contacto@empresa.com"></div><div><label>Teléfono</label><input placeholder="Teléfono"></div></div><div class="duo-row" style="margin-top:20px">'+btn('Volver','arcuva-clientes')+btn('Vista previa · No guardar','demo','green')+'</div></div>';
    }
    el('content').innerHTML=box;
    el('pageTitle').textContent=isCampaign?'Nueva campaña · Demo':'Nuevo cliente · Demo';
  }
  el('content').addEventListener('click',function(evt){var b=evt.target.closest('[data-do]');if(b)action(b.getAttribute('data-do'));});
  el('link'+option).classList.add('active');
  el('demoTitle').textContent=option==='A'?'Opción A · Identidad visual NextWork':'Opción B · Identidad NextWork + Arcuva';
  go('dashboard');
})();
</script>
</body></html>
