name: Publicar Arcuva Certificaciones - pruebas
on:
  push:
    branches: [feature/certificaciones-integracion]
    paths:
      - 'pruebas-sistema/arcuva/**'
      - '.github/workflows/arcuva-certificaciones-pruebas.yml'
permissions:
  contents: read
concurrency:
  group: arcuva-certificaciones-pruebas
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/feature/certificaciones-integracion'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validar archivos y destino de prueba
        working-directory: pruebas-sistema/arcuva
        run: |
          node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8'));if(c.name!=='pantallas-nextwork'||c.assets.directory!=='.')throw Error('Destino inesperado');"
          node --check certificaciones-integracion.js
          node --check portal.js
          test -f .assetsignore
      - name: Publicar Worker de prueba
        working-directory: pruebas-sistema/arcuva
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configurar los dos secretos de Cloudflare en GitHub."
            exit 1
          fi
          npx --yes wrangler@4.168.0 deploy --name pantallas-nextwork --config wrangler.jsonc
      - name: Comprobar publicación
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 https://pantallas-nextwork.jmlopezosornio.workers.dev/ -o index-verificado.html
          grep -q 'certificaciones-integracion.js' index-verificado.html
