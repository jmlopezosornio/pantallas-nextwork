<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nextwork | Sistema de Pantallas</title>
</head>
<body>
<script>
(async()=>{
  try{
    const response = await fetch('./app-base.html', { cache:'no-store' });
    if(!response.ok) throw new Error('No se pudo cargar la aplicación base');
    let html = await response.text();
    const editScript = '<script src="./screen-edit.js?v=1">' + '<' + '/script>';
    const campaignScreenFilterScript = '<script src="./campaign-screen-filter.js?v=1">' + '<' + '/script>';
    html = html.replace('</body>', editScript + campaignScreenFilterScript + '</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML = '<div style="font-family:Arial,sans-serif;padding:40px"><h2>No se pudo cargar NextWork</h2><p>' + String(error.message || error) + '</p></div>';
  }
})();
</script>
</body>
</html>
